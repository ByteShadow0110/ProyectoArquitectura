<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activo · RefaccionesMX</title><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="activos" data-title="Activo (alta / edición)">
<p><a href="activos.html">← Cancelar</a></p>
<form class="card" data-demo="activos.html">
 <div class="form-grid">
  <div class="field"><label for="s">SKU / código *</label><input id="s" required></div>
  <div class="field"><label for="n">Nombre *</label><input id="n" required></div>
  <div class="field"><label for="t">Tipo *</label><select id="t" required><option>Refacción</option><option>Herramienta</option><option>Equipo</option></select></div>
  <div class="field"><label for="c">Categoría</label><select id="c"><option>Pantallas</option><option>Baterías</option><option>Flex y conectores</option><option>Herramienta de taller</option></select></div>
  <div class="field"><label for="st">Stock</label><input id="st" type="number" min="0" value="0"></div>
  <div class="field"><label for="sm">Stock mínimo</label><input id="sm" type="number" min="0" value="0"></div>
  <div class="field"><label for="m">Modelos compatibles</label><input id="m" placeholder="iPhone 11, Galaxy A32"></div>
  <div class="field"><label for="co">Costo (MXN)</label><input id="co" type="number" step="0.01"></div>
 </div>
 <button class="btn">Guardar</button> <a class="btn sec" href="activos.html">Cancelar</a>
 <p class="proto-note">Stock y compatibles aplican a refacciones. El SKU debe ser único.</p>
</form>
<script src="js/app.js"></script></body></html>
